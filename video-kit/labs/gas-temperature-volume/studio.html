<script>
'use strict';
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const FONT = '"Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif';
const EMO = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const log = m => document.getElementById('log').textContent = m;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = x => { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); };
const back = x => { x = clamp(x, 0, 1); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
let LW = null; const L = code => LW.eval(code);
const URL_LAB = 'abio6883-ctrl.github.io/JKscience/gas-temperature-volume';
const C_HOT = '#fb923c', C_COLD = '#60a5fa', C_GAS = '#a78bfa', ACC = '#fb923c';
const VR = t => (273 + t) / 293, vAt = t => 27.2 * VR(t);
function tcol(t, a = 1) { const s = [[-10, [96, 165, 250]], [20, [203, 213, 225]], [50, [253, 186, 116]], [100, [239, 68, 68]]]; t = clamp(t, -10, 100);
  for (let i = 1; i < s.length; i++) if (t <= s[i][0]) { const p = s[i - 1], q = s[i], k = (t - p[0]) / (q[0] - p[0]); const c = p[1].map((v, j) => Math.round(v + (q[1][j] - v) * k)); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; } return `rgba(239,68,68,${a})`; }

// ───────── 화면 배치 ─────────
const PX = 40, PY = 118, PW = 1200, PH = 752;
const SX = 1262, SW = 620;
const FIG = {
  hw: { kind: 'cv', id: 'cvHW', LW: 760, LH: 420, step: dt => L(`hwStep(${dt});hwDraw()`) },
  wb: { kind: 'cv', id: 'cvWB', LW: 760, LH: 420, step: dt => L(`{const d=WB.T-WB.Td; WB.heating=d>.05; if(Math.abs(d)>.05) WB.Td+=Math.sign(d)*Math.min(Math.abs(d),${dt}*7); else WB.Td=WB.T; gasStep(WB.g,syrBox(wbV()),150*VS(WB.Td),${dt},6); markHits(WB.g,VS(WB.Td)); wbDraw(); dGraph();}`) },
  sim: { kind: 'cv', id: 'cvSM', LW: 760, LH: 440, step: dt => L(`SM.Td+=(SM.T-SM.Td)*Math.min(1,${dt}*1.8); gasStep(SM.g,smBox(),240*VS(SM.Td),${dt},10); markHits(SM.g,VS(SM.Td)); smDraw();`) },
  pp: { kind: 'svg', fn: 'ppSVG()', LW: 640, LH: 260, step: dt => { ST.k += (ST.kt - ST.k) * Math.min(1, dt * 1.3); L(`LP.k=${ST.k.toFixed(3)}`); } },
  egg: { kind: 'svg', fn: 'eggSVG()', LW: 640, LH: 260, step: dt => { ST.k += (ST.kt - ST.k) * Math.min(1, dt * ST.rate); L(`LP.k=${ST.k.toFixed(3)};if(LP.egg==='A'&&LP.k>.75)LP.cracked=true;`); } },
  tire: { kind: 'svg', fn: 'tireSVG()', LW: 520, LH: 250, step: dt => { ST.T += (ST.Tt - ST.T) * Math.min(1, dt * 1.2); L(`TR.T=${ST.T.toFixed(2)}`); } }
};
const ST = { k: 0, kt: 0, rate: 1, T: 20, Tt: 20 };
function figRect(f) {
  const [ax, ay, aw, ah] = f.area || [PX + 30, PY + 30, PW - 60, PH - 60];
  const s = Math.min(aw / f.LW, ah / f.LH), w = f.LW * s, h = f.LH * s;
  return { x: ax + (aw - w) / 2, y: ay + (ah - h) / 2, w, h, s };
}

// ───────── 장면 정의 ─────────
const DEF = {

  charles1: { full: 'charles1' },

  sim1: { fig: 'sim', side: 'chain', ev(s) {

  } },
  sim2: { fig: 'sim', side: 'chain', chain: 'up', ev(s) {

    s.ev(s.v(.04), () => L(`SM.T=0`), 'cool'); s.tapF(s.v(.04), 380, 420);
    s.callF(s.v(.4), 3.4, '부피 ↓', 650, 260, '#93c5fd');
    s.callF(s.v(.72), 3.2, '그래도 계속 움직여요', 380, 320, '#c4b5fd');
  } },
  keep: { full: 'keep' },
  pp: { fig: 'pp', side: { t: '🏓 찌그러진 탁구공', l: ['뜨거운 물 위에 올리면', '공 속 기체의 온도 ↑', '기체의 부피 ↑ → 퐁! 펴져요'] }, ev(s) {
    s.ev(0, () => { ST.k = 0; ST.kt = 0; L(`LP.mode='pp';LP.water=null;LP.k=0`); });
    s.ev(s.v(.32), () => { ST.kt = 1; L(`LP.water='hot'`); }, 'splash'); s.tapF(s.v(.32), 320, 200);
    s.ev(s.v(.72), () => { }, 'ping');
    s.callF(s.v(.74), 3, '퐁! 펴졌어요', 320, 70, '#fde047');
  } },
  egg: { fig: 'egg', side: { t: '🥚 달걀 삶기', l: ['A. 바로 끓는 물 → 쩍!', '공기의 부피가 갑자기 ↑', 'B. 찬물부터 서서히 → OK'] }, ev(s) {
    s.ev(0, () => { ST.k = 0; ST.kt = 1; ST.rate = 2.4; L(`LP.mode='egg';LP.egg='A';LP.cracked=false;LP.k=0`); }, 'boil');
    s.ev(s.v(.25), () => { }, 'crack');
    s.callF(s.v(.28), 3, '쩍! 터졌어요', 320, 110, '#fca5a5');
    s.ev(s.v(.62), () => { ST.k = 0; ST.kt = 1; ST.rate = .45; L(`LP.egg='B';LP.cracked=false;LP.k=0`); }, 'pop');
    s.callF(s.v(.7), 3.4, '서서히 → 괜찮아요', 320, 110, '#86efac');
  } },
  answer: { fig: 'tire', side: { t: '⚽ 정답!', l: ['공기가 빠진 게 아니에요', '온도 ↓ → 부피 ↓', '따뜻해지면 다시 팽팽'] }, ev(s) {

  summary: { full: 'summary' },

// ───────── 타임라인 ─────────
let SCN = null, ITEMS = [], TOTAL = 0, EV = [], OV = [], AUD = {};
const CARD = 2.6, PAD0 = 0.35, PAD1 = 0.6;
function buildTimeline() {
  let t = 0; ITEMS = []; EV = []; OV = [];
  let chap = null;
  for (const sc of SCN.scenes) {
    if (sc.chapter) { chap = sc.chapter; ITEMS.push({ type: 'card', t, dur: CARD, chap }); EV.push({ t, fn: () => { }, sfx: 'whoosh' }); t += CARD; }
    const lead = sc.key === 'title' ? 0.9 : PAD0;
    const vd = AUD[sc.key].duration;
    const dur = lead + vd + (sc.key === 'outro' ? 2.6 : PAD1);
    const def = DEF[sc.key] || {};
    const it = { type: 'scene', t, dur, sc, def, chap, vt: t + lead, vd };
    ITEMS.push(it);
    const fr = def.fig ? figRect(FIG[def.fig]) : null;
    const fx = x => fr.x + x * fr.s, fy = y => fr.y + y * fr.s;
    const S = {
      dur, v: f => lead + f * vd,
      ev: (r, fn, sfx) => EV.push({ t: t + r, fn, sfx }),
      tapF: (r, x, y) => { OV.push({ type: 'tap', t0: t + r, d: .7, x: fx(x), y: fy(y) }); },
      tapR: (r, k) => { const p = RP[k]; OV.push({ type: 'tap', t0: t + r, d: .7, x: p[0], y: p[1] }); },
      call: (r, d, text, x, y, color) => OV.push({ type: 'call', t0: t + r, d, text, x, y, color }),
      callF: (r, d, text, x, y, color) => OV.push({ type: 'call', t0: t + r, d, text, x: fx(x), y: fy(y), color }),
      callR: (r, d, text, k, color) => OV.push({ type: 'call', t0: t + r, d, text, x: RP[k][0], y: RP[k][1], color }),
      spot: (r, d, rect) => OV.push({ type: 'spot', t0: t + r, d, rect })
    };
    if (def.ev) def.ev(S);
    t += dur;
  }
  TOTAL = t + 0.4;
  EV.sort((a, b) => a.t - b.t);
}
const RP = { graph: [SX + SW / 2, PY + 200], table: [SX + SW / 2, PY + 560] };

// ───────── 실험실 상태 재생 ─────────
let evI = 0, lastT = -1;
function resetLab() {
  L(`HW.mode='room';HW.Tw=20;HW.Tg=20;HW.eq=true;HW.rec={};HW.pred={hot:null,ice:null};HW.done={hot:false,ice:false};HW._both=false;HW.follow=false;
     WB.series=[{v0:27.2,pts:{}}];WB.T=20;WB.Td=20;WB.diff=false;WB.pred=null;WB.predDone=false;WB.follow=false;
     SM.T=20;SM.Td=20;SM.follow=false;LP.mode='pp';LP.water=null;LP.k=0;LP.egg=null;LP.cracked=false;TR.T=20;TR.run=false;`);
  ST.k = ST.kt = 0; ST.rate = 1; ST.T = ST.Tt = 20;
  evI = 0;
}
function advance(t, it) {
  if (t < lastT) { resetLab(); lastT = -1; }
  L(`__VT=${t}`);
  while (evI < EV.length && EV[evI].t <= t) { try { EV[evI].fn(); } catch (e) { console.error(e); } evI++; }
  const dt = lastT < 0 ? 1 / FPS : clamp(t - lastT, 0, .1);
  lastT = t;
  if (it.type === 'scene' && it.def.fig) { const f = FIG[it.def.fig]; if (f.step && dt > 0) f.step(dt); }
}

// ───────── 이미지 ─────────
const SVGC = new Map();
async function svgImg(markup, w, h) {
  if (SVGC.has(markup)) return SVGC.get(markup);
  let m = markup.replace(/^<svg /, `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" font-family="Malgun Gothic, sans-serif" `);
  m = m.replace(/(<svg[^>]*?)\sxmlns="http:\/\/www.w3.org\/2000\/svg"([^>]*?)\sxmlns="http:\/\/www.w3.org\/2000\/svg"/, '$1 xmlns="http://www.w3.org/2000/svg"$2');
  const url = URL.createObjectURL(new Blob([m], { type: 'image/svg+xml' }));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  URL.revokeObjectURL(url);
  if (SVGC.size > 40) SVGC.delete(SVGC.keys().next().value);
  SVGC.set(markup, img); return img;
}
async function figImage(f) {
  if (f.kind === 'cv') return LW.document.getElementById(f.id);
  return svgImg(L(f.fn).trim(), f.LW * 2, f.LH * 2);
}

// ───────── 그리기 도우미 ─────────
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, size, color = '#fff', weight = 900, align = 'left', font = FONT) { ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); }
function stroked(s, x, y, size, color, align = 'left', sw = 12) { ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round'; if (sw) { ctx.lineWidth = sw; ctx.strokeStyle = '#0b1020'; ctx.strokeText(s, x, y); } ctx.fillStyle = color; ctx.fillText(s, x, y); }
function emo(s, x, y, size) { ctx.font = `${size}px ${EMO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff'; ctx.fillText(s, x, y); }
function bg(t) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#0f1a38'); g.addColorStop(1, '#2a1230'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const r = ctx.createRadialGradient(240, -80, 50, 240, -80, 1100); r.addColorStop(0, 'rgba(56,189,248,.26)'); r.addColorStop(1, 'rgba(56,189,248,0)'); ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
  const r2 = ctx.createRadialGradient(1800, 1100, 50, 1800, 1100, 950); r2.addColorStop(0, 'rgba(251,146,60,.24)'); r2.addColorStop(1, 'rgba(251,146,60,0)'); ctx.fillStyle = r2; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 24; i++) { const sp = 22 + (i % 5) * 9, y = H + 40 - ((i * 211 + t * sp) % (H + 80)), x = (i * 283) % W + Math.sin(t * .7 + i) * 18, r0 = 4 + (i % 4) * 3;
    ctx.strokeStyle = i % 2 ? 'rgba(253,186,116,.16)' : 'rgba(147,197,253,.16)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r0, 0, 7); ctx.stroke(); }
}
function topBar(it, t) {
  ctx.fillStyle = 'rgba(8,10,30,.75)'; ctx.fillRect(0, 0, W, 92);
  rr(28, 18, 56, 56, 16); const g = ctx.createLinearGradient(28, 18, 84, 74); g.addColorStop(0, '#38bdf8'); g.addColorStop(1, '#fb923c'); ctx.fillStyle = g; ctx.fill();
  emo('🎈', 56, 60, 32);
  txt('기체의 온도와 부피 가상실험실', 100, 56, 30, '#fff', 900);
  txt('중1 과학 · Ⅵ. 기체의 성질', 100, 80, 17, '#a5b4d8', 700);
  if (it.chap) { ctx.font = `900 26px ${FONT}`; const s = `${it.chap.num}  ${it.chap.title}`; const w = ctx.measureText(s).width + 50; rr(W - 40 - w, 22, w, 50, 25); ctx.fillStyle = '#7c2d12'; ctx.fill(); ctx.strokeStyle = '#fb923c'; ctx.lineWidth = 2; ctx.stroke(); txt(s, W - 40 - w / 2, 56, 26, '#fff', 900, 'center'); }
  ctx.fillStyle = '#1e2448'; ctx.fillRect(0, 92, W, 6); const pg = ctx.createLinearGradient(0, 0, W, 0); pg.addColorStop(0, '#38bdf8'); pg.addColorStop(1, '#fb923c'); ctx.fillStyle = pg; ctx.fillRect(0, 92, W * clamp(t / TOTAL, 0, 1), 6);
}
function subtitle(it, t) {
  const sc = it.sc; if (!sc) return;
  const lt = t - it.vt; if (lt < -0.2 || lt > it.vd + 0.3) return;
  const chunks = it.chunks || (it.chunks = splitChunks(sc.text));
  const tot = chunks.reduce((a, c) => a + c.length, 0); let acc = 0, cur = chunks[chunks.length - 1];
  for (const c of chunks) { const end = (acc + c.length) / tot * it.vd; if (lt <= end) { cur = c; break; } acc += c.length; }
  ctx.font = `800 44px ${FONT}`;
  const lines = wrap(cur, 1500);
  const h = lines.length * 58 + 34, w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 80;
  const y0 = H - 34 - h;
  rr(W / 2 - w / 2, y0, w, h, 26); ctx.fillStyle = 'rgba(6,8,24,.88)'; ctx.fill(); ctx.strokeStyle = 'rgba(251,146,60,.6)'; ctx.lineWidth = 2; ctx.stroke();
  lines.forEach((l, i) => { txt(l, W / 2, y0 + 58 + i * 58, 44, '#fff', 800, 'center'); });
}
function splitChunks(s) {
  const parts = s.replace(/(\d)\.(\d)/g, '$1․$2').replace(/…/g, '…|').split('|').join(' ').match(/[^.!?]+[.!?]?/g).map(x => x.trim().replace(/․/g, '.')).filter(Boolean);
  const out = []; let cur = '';
  for (const p of parts) { if ((cur + ' ' + p).trim().length <= 44) cur = (cur + ' ' + p).trim(); else { if (cur) out.push(cur); cur = p; } }
  if (cur) out.push(cur); return out;
}
function wrap(s, maxW) {
  const words = s.split(' '); const lines = []; let cur = '';
  for (const w of words) { const n = cur ? cur + ' ' + w : w; if (ctx.measureText(n).width > maxW && cur) { lines.push(cur); cur = w; } else cur = n; }
  if (cur) lines.push(cur); return lines;
}
function credit() { txt('Made by Lee Jae Kwang', W - 36, H - 12, 18, 'rgba(200,210,240,.5)', 700, 'right'); }
function panel(x, y, w, h, fill = 'rgba(16,20,52,.92)') { rr(x, y, w, h, 24); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = '#2c3166'; ctx.lineWidth = 2; ctx.stroke(); }
function readout(x, y, w, label, val, col, hh = 136) {
  rr(x, y, w, hh, 20); ctx.fillStyle = '#1b2050'; ctx.fill(); ctx.strokeStyle = '#2f3675'; ctx.lineWidth = 2; ctx.stroke();
  txt(label, x + 26, y + 42, 26, '#a5b4d8', 800); txt(val, x + 26, y + hh - 26, 50, col, 900);
}

// ───────── 실험실 패널 ─────────
async function drawLabPanel(it, t) {
  const f = FIG[it.def.fig];
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 30; rr(PX - 8, PY - 8, PW + 16, PH + 16, 30); ctx.fillStyle = '#0a0d24'; ctx.fill(); ctx.restore();
  rr(PX, PY, PW, PH, 24); ctx.fillStyle = '#fffaf5'; ctx.fill();
  const img = await figImage(f), r = figRect(f);
